[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "trading-core"
version = "0.1.0"
description = "Deterministic market-regime, signal, and risk logic for the trading bot"
requires-python = ">=3.12"

[tool.setuptools.packages.find]
where = ["src"]
