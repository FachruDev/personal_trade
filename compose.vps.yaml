# Overrides for a 24/7 Linux host. Use together with compose.yaml:
#   docker compose -f compose.yaml -f compose.vps.yaml --env-file .env.example up -d
# or simply: bash scripts/vps-compose.sh up -d
#
# Adds what an unattended, possibly shared host needs:
# - every service restarts after a crash or reboot;
# - container logs are rotated so they cannot fill the disk;
# - each container has a memory cap so a runaway process cannot starve other workloads on the host;
# - the Freqtrade UI is published on 127.0.0.1:${FREQTRADE_UI_PORT:-18080} instead of 8080, which shared
#   servers often already use.
# Ports stay bound to 127.0.0.1; reach the dashboard (3000) and Freqtrade UI through an SSH tunnel.
#
# Memory caps are starting points. Check real use with `docker stats --no-stream` after a day and adjust.

x-logging: &rotated-logs
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  postgres:
    restart: unless-stopped
    logging: *rotated-logs
    mem_limit: 768m
  redis:
    restart: unless-stopped
    logging: *rotated-logs
    mem_limit: 128m
  api:
    restart: unless-stopped
    logging: *rotated-logs
    mem_limit: 512m
  web:
    restart: unless-stopped
    logging: *rotated-logs
    mem_limit: 512m
  freqtrade:
    restart: unless-stopped
    logging: *rotated-logs
    mem_limit: 1536m
    ports: !override
      - "127.0.0.1:${FREQTRADE_UI_PORT:-18080}:8080"
