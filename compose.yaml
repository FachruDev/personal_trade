services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes: ["redis-data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: {context: ., dockerfile: infrastructure/docker/api.Dockerfile}
    env_file: .env
    ports: ["127.0.0.1:${API_PORT:-8000}:8000"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5

  freqtrade:
    build: {context: ., dockerfile: infrastructure/docker/freqtrade.Dockerfile}
    env_file: .env
    command: >-
      trade --config /freqtrade/user_data/config.json --strategy RegimeRiskStrategy
    environment:
      FREQTRADE__EXCHANGE__KEY: ${BINANCE_API_KEY:-}
      FREQTRADE__EXCHANGE__SECRET: ${BINANCE_API_SECRET:-}
      FREQTRADE__API_SERVER__USERNAME: ${FREQTRADE_API_USERNAME}
      FREQTRADE__API_SERVER__PASSWORD: ${FREQTRADE_API_PASSWORD}
      FREQTRADE__API_SERVER__JWT_SECRET_KEY: ${FREQTRADE_JWT_SECRET}
    ports: ["127.0.0.1:8080:8080"]
    volumes: ["./freqtrade:/freqtrade/user_data"]
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
