services:
  postgres:
    image: postgres:17-alpine
    # Read values verbatim so characters in local secrets are not interpreted
    # by Compose before PostgreSQL receives them.
    env_file:
      - path: .env
        format: raw
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes: ["redis-data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: {context: ., dockerfile: infrastructure/docker/api.Dockerfile}
    env_file:
      - path: .env
        format: raw
    environment:
      POSTGRES_HOST: postgres
    ports: ["127.0.0.1:${API_PORT:-8000}:8000"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5

  freqtrade:
    build: {context: ., dockerfile: infrastructure/docker/freqtrade.Dockerfile}
    env_file:
      - path: .env
        format: raw
    command: >-
      sh -c 'export FREQTRADE__EXCHANGE__KEY="$$BINANCE_API_KEY";
      export FREQTRADE__EXCHANGE__SECRET="$$BINANCE_API_SECRET";
      export FREQTRADE__API_SERVER__USERNAME="$$FREQTRADE_API_USERNAME";
      export FREQTRADE__API_SERVER__PASSWORD="$$FREQTRADE_API_PASSWORD";
      export FREQTRADE__API_SERVER__JWT_SECRET_KEY="$$FREQTRADE_JWT_SECRET";
      export FREQTRADE__WEBHOOK__URL="http://api:8000/internal/freqtrade";
      exec freqtrade trade --config /freqtrade/user_data/config.json --strategy RegimeRiskStrategy'
    ports: ["127.0.0.1:8080:8080"]
    volumes: ["./freqtrade:/freqtrade/user_data"]
    depends_on:
      api: {condition: service_healthy}
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
